[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "End-to-end customer churn prediction with calibration, cost-based decisions, and a FastAPI service"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
